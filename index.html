<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minik English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6E5;--ink:#2B2D42;--pri:#5B5FEF;--ok:#2EC27E;--bad:#FF5A5F;--yel:#FFC93C;--card:#fff;--shadow:0 6px 0 rgba(43,45,66,.12),0 10px 24px rgba(43,45,66,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
body{background:radial-gradient(circle at 10% 10%,#FFE3B3 0,transparent 35%),radial-gradient(circle at 90% 85%,#D9E8FF 0,transparent 40%),var(--bg)}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;padding:clamp(12px,2.5vw,28px)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* visuals */
.vis{display:inline-block;line-height:1}
.digit{font-weight:800}
.emo{font-size:.82em}
.swatch{width:.9em;height:.9em;border-radius:30%;box-shadow:inset 0 -.07em 0 rgba(0,0,0,.15)}
.swatch.light{box-shadow:inset 0 0 0 4px #D5D5D5}

/* home */
.hero{text-align:center;margin:8px 0 18px}
.hero h1{font-size:clamp(34px,6vw,60px);margin:0;line-height:1;font-weight:800;color:var(--pri)}
.hero h1 span{color:#F15BB5}
.hero p{margin:6px 0 0;font-size:clamp(16px,2.4vw,22px);opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(180px,26vw,250px),1fr));gap:clamp(14px,2.4vw,26px);max-width:1100px;margin:0 auto;width:100%}
.topic{background:var(--card);border-radius:30px;padding:26px 12px 20px;text-align:center;box-shadow:var(--shadow);transition:transform .15s;position:relative;overflow:hidden}
.topic:active{transform:scale(.96)}
.topic .em{font-size:clamp(60px,9vw,90px);line-height:1.1}
.topic .tr{font-size:clamp(22px,3vw,32px);font-weight:800}
.topic .en{font-size:clamp(16px,2vw,20px);opacity:.6;font-weight:700}
.topic .band{position:absolute;left:0;right:0;top:0;height:10px}
.topic .prog{font-size:16px;font-weight:700;margin-top:4px;color:#B8A98A}

/* bars */
.bar{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.back{width:clamp(52px,7vw,64px);height:clamp(52px,7vw,64px);border-radius:20px;background:#fff;box-shadow:var(--shadow);font-size:30px;font-weight:800;flex:none}
.back:active{transform:translateY(3px)}
.ptitle{font-size:clamp(22px,3.4vw,34px);font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:8px;flex:none}
.dots span{width:clamp(14px,2vw,20px);height:clamp(14px,2vw,20px);border-radius:50%;background:#E3DCCB;transition:.3s}
.dots span.cur{background:var(--yel);transform:scale(1.25)}
.dots span.done{background:var(--ok)}

/* topic page */
.panel{flex:none;background:#fff;border-radius:26px;padding:14px 16px 18px;box-shadow:var(--shadow);max-width:1100px;margin:0 auto 18px;width:100%}
.panel h3{margin:0 0 8px;font-size:clamp(18px,2.4vw,24px)}
.learnRow{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(74px,9vw,96px),1fr));gap:10px}
.lnum{width:100%;aspect-ratio:1;border-radius:20px;font-size:clamp(40px,5.4vw,56px);display:flex;align-items:center;justify-content:center;background:#FFF9EE;box-shadow:inset 0 0 0 3px #F1E6CF}
.lnum:active,.lnum.hit{transform:scale(.9);background:#FFF0C9}
.lword{display:block;text-align:center;font-weight:700;font-size:clamp(14px,1.7vw,18px);opacity:.75;margin-top:2px}
.ranger{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:clamp(18px,2.4vw,24px);font-weight:700}
.stp{display:flex;align-items:center;gap:8px;background:#FFF9EE;border-radius:99px;padding:4px 6px;box-shadow:inset 0 0 0 3px #F1E6CF}
.stp b{min-width:1.6em;text-align:center;font-size:clamp(30px,4vw,40px);color:var(--pri)}
.sb{width:48px;height:48px;border-radius:50%;background:var(--pri);color:#fff;font-size:30px;font-weight:800;line-height:1}
.sb:active{transform:scale(.9)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,18vw,190px),1fr));gap:clamp(10px,1.8vw,18px);max-width:1100px;margin:0 auto;width:100%;padding-bottom:20px}
.pcard{background:#fff;border-radius:24px;padding:14px 10px 12px;box-shadow:var(--shadow);text-align:center;position:relative}
.pcard:active{transform:scale(.96)}
.pcard .no{position:absolute;top:8px;left:12px;font-weight:800;opacity:.35;font-size:18px}
.pcard .em{font-size:clamp(40px,5.5vw,56px);line-height:1.15}
.pcard .nm{font-weight:800;font-size:clamp(16px,2.1vw,21px);line-height:1.15}
.pcard .st{font-size:22px;letter-spacing:2px;color:#E3DCCB;margin-top:2px}
.pcard .st b{color:var(--yel);font-weight:400}

/* practice stage */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.4vh,28px);min-height:0;position:relative}
.inst{font-size:clamp(20px,3vw,30px);font-weight:700;text-align:center;background:#fff;padding:6px 22px;border-radius:99px;box-shadow:var(--shadow)}
.spk{border-radius:50%;background:var(--pri);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #3E41C4;flex:none}
.spk.big{width:clamp(110px,16vw,150px);height:clamp(110px,16vw,150px);font-size:clamp(52px,7vw,70px)}
.spk.mid{width:clamp(62px,9vw,84px);height:clamp(62px,9vw,84px);font-size:clamp(30px,4vw,40px)}
.spk:active,.spk.pulse{animation:pulse .5s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.row{display:flex;align-items:center;gap:clamp(14px,3vw,30px);flex-wrap:wrap;justify-content:center}
.choices{display:flex;gap:clamp(14px,3vw,36px);flex-wrap:wrap;justify-content:center}
.card{background:#fff;border-radius:30px;min-width:clamp(120px,18vw,190px);height:clamp(130px,20vw,200px);padding:0 18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;transition:transform .12s,background .2s;border:5px solid transparent;font-size:clamp(76px,11vw,124px)}
.card:active{transform:translateY(4px)}
.card.right{border-color:var(--ok);background:#E5FFF1;animation:bounce .6s}
.card.wrong{border-color:var(--bad);background:#FFE9EA}
.card.sel{border-color:var(--yel);background:#FFF5D6}
.word{font-size:clamp(34px,5.2vw,56px);font-weight:800;color:var(--ink);line-height:1.1}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.15)}70%{transform:scale(.95)}100%{transform:scale(1)}}
.bigshow{background:#fff;border-radius:34px;padding:10px 40px;box-shadow:var(--shadow);display:flex;align-items:center;gap:22px;font-size:clamp(100px,15vw,160px);min-height:clamp(140px,20vw,210px)}
.bigshow .word{font-size:clamp(56px,9vw,100px)}

/* match */
.match{position:relative;display:flex;justify-content:center;align-items:stretch;width:min(820px,100%);flex:1;max-height:600px}
.match>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:10px;z-index:1}
.gap{flex:1;min-width:80px}
.mItem{display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;padding:8px 14px;box-shadow:var(--shadow);touch-action:none;border:4px solid transparent;font-size:clamp(50px,7.5vw,78px)}
.mItem.sel{border-color:var(--yel)}
.mItem.matched{border-color:var(--ok);background:#E5FFF1}
.mItem .vis{min-width:1.1em;text-align:center}
.dot{width:26px;height:26px;border-radius:50%;background:var(--ink);border:5px solid #fff;box-shadow:0 0 0 3px var(--ink);flex:none}
.matched .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok)}

/* drag */
.arrow{font-size:clamp(40px,6vw,64px);opacity:.4}
.drop{width:clamp(140px,20vw,200px);height:clamp(140px,20vw,200px);border-radius:30px;border:6px dashed #C9BFA8;display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:800;color:#C9BFA8;background:rgba(255,255,255,.6);transition:.2s}
.drop.hover{border-color:var(--yel);background:#FFF5D6}
.drop.filled{border-style:solid;border-color:var(--ok);background:#E5FFF1;font-size:clamp(66px,9vw,100px)}
.tiles{display:flex;gap:clamp(12px,2.4vw,26px);flex-wrap:wrap;justify-content:center}
.tile{width:clamp(110px,15vw,150px);height:clamp(110px,15vw,150px);border-radius:26px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;font-size:clamp(62px,8.5vw,92px)}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.1) rotate(-4deg);box-shadow:0 16px 30px rgba(0,0,0,.2)}

/* count */
.things{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:760px;background:#fff;border-radius:30px;padding:18px 24px;box-shadow:var(--shadow)}
.things span{font-size:clamp(46px,7vw,72px);line-height:1;animation:pop .4s backwards}
.things.many span{font-size:clamp(34px,4.8vw,50px)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* balloons */
.sky{position:relative;width:min(900px,100%);flex:1;min-height:300px}
.balloon{position:absolute;width:clamp(96px,13vw,130px);height:clamp(120px,16vw,160px);border-radius:50% 50% 48% 48%/55% 55% 45% 45%;display:flex;align-items:center;justify-content:center;font-size:clamp(46px,6.5vw,66px);font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18);box-shadow:inset -12px -14px 0 rgba(0,0,0,.12),inset 10px 10px 0 rgba(255,255,255,.25);animation:float 3s ease-in-out infinite}
.balloon.lightb{box-shadow:inset -12px -14px 0 rgba(0,0,0,.08),inset 0 0 0 4px #D5D5D5}
.balloon:after{content:'';position:absolute;bottom:-46px;left:50%;width:2px;height:46px;background:#9a9a9a}
.balloon.popped{animation:boom .35s forwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes boom{0%{transform:scale(1);opacity:1}60%{transform:scale(1.5);opacity:.6}100%{transform:scale(1.9);opacity:0}}

/* basket */
.orchard{display:flex;gap:clamp(16px,4vw,50px);align-items:stretch;width:min(950px,100%);flex:1;max-height:480px}
.tree,.basket{flex:1;border-radius:30px;padding:16px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px}
.tree{background:#DFF5D8;box-shadow:inset 0 0 0 4px #BFE5B3}
.basket{background:#F4DDB8;box-shadow:inset 0 0 0 4px #D9B57D;position:relative}
.basket .lbl{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:44px;opacity:.5}
.apple{font-size:clamp(50px,6.6vw,70px);line-height:1;padding:2px;transition:transform .15s}
.orchard.many .apple{font-size:clamp(36px,4.6vw,50px)}
.apple:active{transform:scale(.85)}
.btn{background:var(--ok);color:#fff;font-size:clamp(22px,3vw,30px);font-weight:800;padding:10px 34px;border-radius:99px;box-shadow:0 6px 0 #1F9660}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1F9660}
.btn.alt{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.btn[disabled]{opacity:.4}
.counter{font-size:clamp(28px,4vw,40px);font-weight:800;background:#fff;border-radius:99px;padding:0 22px;box-shadow:var(--shadow)}

/* order + missing */
.slots{display:flex;gap:clamp(8px,1.6vw,16px);flex-wrap:wrap;justify-content:center}
.slot{width:clamp(96px,13vw,130px);height:clamp(96px,13vw,130px);border-radius:24px;border:5px dashed #C9BFA8;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.5);font-size:clamp(54px,7.5vw,80px)}
.slot.full{border:5px solid var(--ok);background:#E5FFF1;animation:bounce .5s}
.slot.q{border-color:var(--yel);background:#FFF5D6;font-weight:800;color:#E0A800}
.tile2{width:clamp(96px,13vw,130px);height:clamp(96px,13vw,130px);border-radius:24px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;transition:.2s;font-size:clamp(54px,7.5vw,80px)}
.shadow{filter:brightness(0);opacity:.78}
.tile2.gone{opacity:0;transform:scale(.4);pointer-events:none}

/* memory */
.mem{display:grid;gap:clamp(10px,2vw,20px)}
.mcard{width:clamp(120px,17vw,180px);height:clamp(120px,17vw,170px);border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:clamp(56px,7.5vw,80px);background:var(--pri);color:#fff;border:5px solid transparent}
.mcard .front{display:none}
.mcard .back{font-size:.8em;font-weight:800}
.mcard.up{background:#fff;color:var(--ink);animation:flip .3s}
.mcard.up .front{display:flex}.mcard.up .back{display:none}
.mcard.done{border-color:var(--ok);background:#E5FFF1}
.mcard .word{font-size:clamp(28px,4vw,42px)}
@keyframes flip{0%{transform:scaleX(.1)}100%{transform:scaleX(1)}}

/* yes/no */
.yn{width:clamp(130px,18vw,180px);height:clamp(110px,15vw,150px);border-radius:30px;font-size:clamp(64px,9vw,90px);font-weight:800;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.18)}
.yn.y{background:var(--ok)}.yn.n{background:var(--bad)}
.yn:active{transform:translateY(5px)}

/* find all */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2vw,18px)}
.fcell{width:clamp(110px,16vw,160px);height:clamp(100px,14vw,140px);border-radius:24px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:clamp(54px,7.5vw,80px);border:5px solid transparent;position:relative}
.fcell.found{border-color:var(--ok);background:#E5FFF1}
.fcell.found:after{content:'✓';position:absolute;top:2px;right:10px;font-size:30px;color:var(--ok);font-weight:800}

/* paint */
.canvas{width:clamp(200px,30vw,300px);height:clamp(200px,30vw,300px);background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:20px}
.canvas svg{width:100%;height:100%}
.canvas path{transition:fill .5s}

/* listen pick */
.lcard{flex-direction:column;gap:6px}
.lcard .lsp{font-size:.7em}
.lcard .lno{font-size:22px;font-weight:800;opacity:.4}

/* mascot */
.mascot{display:block;pointer-events:none;-webkit-user-drag:none}
.heroM{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.heroM button{pointer-events:auto}
.mascot.big{width:clamp(260px,38vw,420px);animation:float 3.2s ease-in-out infinite}
.bubble{background:#fff;border-radius:26px;padding:10px 22px;box-shadow:var(--shadow);font-size:clamp(20px,2.8vw,28px);font-weight:800;position:relative;max-width:300px}
.bubble:after{content:'';position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid #fff;border-left:0}
.mascot.mini{height:clamp(64px,9vw,90px);width:auto;flex:none}
.mascot.side{height:clamp(70px,10vw,100px);width:auto;flex:none;animation:float 3s ease-in-out infinite}
.mascot.happy{animation:hop .9s}
.mascot.oops{animation:oops .6s}
@keyframes hop{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-22px) rotate(-10deg) scale(1.12)}60%{transform:translateY(0) rotate(6deg)}100%{transform:none}}
@keyframes oops{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
.mascot.winM{width:clamp(200px,28vw,320px);margin:0 auto;animation:flyin 1s cubic-bezier(.2,.9,.3,1.2) backwards,float 3s ease-in-out 1s infinite}
@keyframes flyin{from{transform:translate(-70vw,30vh) rotate(-25deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.spark{position:fixed;z-index:70;pointer-events:none;font-size:28px;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(180deg);opacity:0}}

/* art */
.vis.art{line-height:0}
.vis.art svg{display:block;overflow:hidden}
.ti{font-size:1.15em;vertical-align:-.2em;display:inline-block}
.spk .vis.art{font-size:.62em}
.lcard .lsp{font-size:.62em}
.mcard .back .vis{font-size:.9em}
.balloon .binner{font-size:.85em;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.basket .lbl{opacity:.35;font-size:54px;display:flex;justify-content:center}
.ring{animation:ringp 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ringp{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.figure{height:min(62vh,540px);aspect-ratio:184/300;background:#fff;border-radius:32px;box-shadow:var(--shadow);padding:12px;touch-action:none}
.figure svg{width:100%;height:100%;display:block}
.topic .em .vis{font-size:1.25em}

/* subs */
.subgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.topic.sub{padding:16px 8px 12px}
.topic.sub .em{font-size:clamp(46px,6vw,64px)}
.topic.sub .tr{font-size:clamp(17px,2.2vw,24px)}
.mixh{max-width:1100px;margin:4px auto 10px;width:100%;font-size:clamp(18px,2.4vw,24px)}
@media (max-width:700px){.subgrid{grid-template-columns:repeat(2,1fr)}}

/* intro video */
.vstage{position:relative;width:min(96vw,calc((100vh - 150px)*1.6));aspect-ratio:16/10;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);background:#BFE3FF;flex:none}
.bg-party{background:linear-gradient(#FFE1EC 0 74%,#E8B07A 74%)}
.bg-meadow{background:linear-gradient(#BFE3FF 0 62%,#7ED36F 62%)}
.bg-gray{background:linear-gradient(#E6E6E6 0 62%,#C4C4C4 62%)}
.bg-zoo{background:linear-gradient(#BFE3FF 0 60%,#9BD97A 60%)}
.bg-farm{background:linear-gradient(#CDEBFF 0 60%,#B8E07A 60%)}
.bg-room{background:linear-gradient(#FFE0B2 0 80%,#C98B4B 80%)}
.bg-kitchen{background:linear-gradient(rgba(255,255,255,0) 0 76%,#E9D7C0 76%),repeating-conic-gradient(#fff 0 25%,#E3F2FD 0 50%) 0 0/10% 16%}
.bg-bedroom{background:linear-gradient(#E6E0FF 0 80%,#B98AF0 80%)}
.bg-park,.bg-outside{background:linear-gradient(#BFE3FF 0 62%,#7ED36F 62%)}
.vdeco{position:absolute;pointer-events:none}
.fence{left:0;right:0;top:46%;height:16%;background:linear-gradient(transparent 22%,#B07A3E 22% 32%,transparent 32% 66%,#B07A3E 66% 76%,transparent 76%),repeating-linear-gradient(90deg,#C98B4B 0 1.4%,transparent 1.4% 6%)}
.fence.low{top:50%;height:12%;left:40%}
.counter{left:0;right:0;bottom:0;height:24%;background:#E9D7C0;border-top:.6em solid #C98B4B}
.rug{left:30%;right:30%;bottom:3%;height:12%;border-radius:50%;background:#FF9FB0;opacity:.7}
.vwin{position:absolute;z-index:1;left:18%;top:10%;width:52%;height:62%;border:1.4em solid #fff;border-radius:2em;box-shadow:0 0 0 .5em #3D2B3D,inset 0 0 0 .4em #3D2B3D;overflow:hidden;background:#9FD7FF;transition:background 1s}
.vwin:before,.vwin:after{content:'';position:absolute;background:#fff;z-index:2}
.vwin:before{left:50%;top:0;bottom:0;width:1em;margin-left:-.5em}.vwin:after{top:50%;left:0;right:0;height:1em;margin-top:-.5em}
.vitem{position:absolute;transform:translate(-50%,-50%);transition:left .8s ease-in-out,top .8s ease-in-out,opacity .5s,filter .6s;line-height:0;z-index:3}
.vitem.pop{animation:vpop .55s}
.vitem.vout{opacity:0}
.vitem.g{filter:grayscale(1) brightness(1.05)}
.vitem.slide{transition:left .8s ease-in-out}

<body>
<div id="app"></div>
<script>
/* ---------- helpers ---------- */
const NW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const NCOL=['#FF5A5F','#FF9F1C','#E0A800','#2EC27E','#00A6A6','#3D9BE9','#5B5FEF','#9B5DE5','#F15BB5','#FF6F61'];
const numColor=n=>NCOL[(n+9)%10];
const shade=c=>{const n=parseInt(c.slice(1),16),f=v=>Math.max(0,Math.round(v*.72));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`};
const app=document.getElementById('app');
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pickN=(arr,n)=>shuffle(arr).slice(0,Math.max(0,n));
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
function h(tag,props={},...kids){const e=document.createElement(tag);for(const k in props){const v=props[k];if(v==null)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}kids.flat(3).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c))});return e}
function bodySvg(part){const hl=k=>part===k?' stroke="#FF2D6F" stroke-width="9"':' stroke="#C9A27E" stroke-width="2"';
 return '<svg viewBox="12 4 76 96" width="1em" height="1em"><path d="M12 100 C12 80 30 72 50 72 C70 72 88 80 88 100 Z" fill="#7FB3E8" stroke="#5A8FC8" stroke-width="2"/>'+
 '<rect x="41" y="50" width="18" height="26" rx="5" fill="#F2C9A5"'+hl('neck')+'/>'+
 '<circle cx="50" cy="31" r="23" fill="#F2C9A5"'+hl('head')+'/><path d="M28 26 C30 8 70 8 72 26 C64 18 40 16 28 26 Z" fill="#8B5A2B"/>'+
 '<circle cx="42" cy="33" r="3" fill="#2B2D42"/><circle cx="58" cy="33" r="3" fill="#2B2D42"/><path d="M43 42 Q50 47 57 42" stroke="#2B2D42" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>'}
function vis(it){
 if(it.kind==='num'){const c=numColor(it.n);return h('span',{class:'vis digit cute',style:`--c:${c};--d:${shade(c)}`},h('span',{class:'dtx'},String(it.n)),h('span',{class:'deyes'},h('i'),h('i')))}
 if(it.kind==='color'){const e=h('span',{class:'vis art'});e.innerHTML=splat(it.val);return e}
 return artEl(it.val)}
const wordEl=it=>h('span',{class:'word'},it.word);
/* ---------- ART: hand-drawn SVG set ---------- */
const OL='#3D2B3D';
const SV=(vb,inner)=>`<svg viewBox="${vb}" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round" stroke-linecap="round">${inner}</svg>`;
const ln=(d,c,w)=>`<path d="${d}" fill="none" stroke="${OL}" stroke-width="${w+4}"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
function face(cx,cy,k=1,mood='happy'){const e=`<circle cx="${cx-9*k}" cy="${cy}" r="${3.2*k}" fill="${OL}"/><circle cx="${cx+9*k}" cy="${cy}" r="${3.2*k}" fill="${OL}"/><circle cx="${cx-8*k}" cy="${cy-1.2*k}" r="${1.1*k}" fill="#fff"/><circle cx="${cx+10*k}" cy="${cy-1.2*k}" r="${1.1*k}" fill="#fff"/>`;
 const ch=`<ellipse cx="${cx-15*k}" cy="${cy+5*k}" rx="${4*k}" ry="${2.6*k}" fill="#FF8FA3" opacity=".7"/><ellipse cx="${cx+15*k}" cy="${cy+5*k}" rx="${4*k}" ry="${2.6*k}" fill="#FF8FA3" opacity=".7"/>`;
 const m=mood==='sad'?`<path d="M${cx-5*k} ${cy+10*k} Q${cx} ${cy+5*k} ${cx+5*k} ${cy+10*k}" fill="none" stroke="${OL}" stroke-width="${2.4*k}"/>`
  :mood==='o'?`<ellipse cx="${cx}" cy="${cy+8*k}" rx="${3*k}" ry="${3.6*k}" fill="${OL}"/>`
  :`<path d="M${cx-6*k} ${cy+6*k} Q${cx} ${cy+12*k} ${cx+6*k} ${cy+6*k}" fill="none" stroke="${OL}" stroke-width="${2.4*k}"/>`;
 return e+ch+m}
function cloud(cx,cy,s,fill){const sh=`<circle cx="${cx-22*s}" cy="${cy+2*s}" r="${16*s}"/><circle cx="${cx}" cy="${cy-8*s}" r="${22*s}"/><circle cx="${cx+23*s}" cy="${cy+1*s}" r="${17*s}"/><rect x="${cx-22*s}" y="${cy}" width="${45*s}" height="${18*s}" rx="${3*s}"/>`;
 return `<g fill="${fill}" stroke="${OL}" stroke-width="6">${sh}</g><g fill="${fill}">${sh}</g><ellipse cx="${cx-6*s}" cy="${cy-18*s}" rx="${7*s}" ry="${3.5*s}" fill="#fff" opacity=".6"/>`}
function sun(cx,cy,r,fc=true){let rays='';for(let i=0;i<10;i++){const a=i*Math.PI/5,x1=cx+Math.cos(a)*(r+5),y1=cy+Math.sin(a)*(r+5),x2=cx+Math.cos(a)*(r+14*r/24),y2=cy+Math.sin(a)*(r+14*r/24);rays+=ln(`M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}`,'#FFB300',4*r/24+1)}
 return rays+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFD54A" stroke="${OL}" stroke-width="3"/><ellipse cx="${cx-r*.4}" cy="${cy-r*.5}" rx="${r*.25}" ry="${r*.14}" fill="#fff" opacity=".6"/>`+(fc?face(cx,cy,r/24):'')}
const drop=(x,y,s=1)=>`<path d="M${x} ${y-8*s} C${x+6*s} ${y} ${x+6*s} ${y+6*s} ${x} ${y+6*s} C${x-6*s} ${y+6*s} ${x-6*s} ${y} ${x} ${y-8*s} Z" fill="#4FA3F7" stroke="${OL}" stroke-width="2.5"/>`;
function flake(x,y,r){let d='';for(let i=0;i<3;i++){const a=i*Math.PI/3;d+=`M${(x-Math.cos(a)*r).toFixed(1)} ${(y-Math.sin(a)*r).toFixed(1)} L${(x+Math.cos(a)*r).toFixed(1)} ${(y+Math.sin(a)*r).toFixed(1)} `}return `<path d="${d}" fill="none" stroke="${OL}" stroke-width="5"/><path d="${d}" fill="none" stroke="#fff" stroke-width="2.2"/>`+`<circle cx="${x}" cy="${y}" r="2.4" fill="#BFE3FF" stroke="${OL}" stroke-width="1.5"/>`}
const bolt=(dx=0,dy=0)=>`<polygon transform="translate(${dx} ${dy})" points="52,52 40,74 50,74 43,96 66,64 54,64 61,52" fill="#FFD54A" stroke="${OL}" stroke-width="3"/>`;
function thermo(level,col){const top=24+(1-level)*44;return `<rect x="58" y="14" width="18" height="62" rx="9" fill="#fff" stroke="${OL}" stroke-width="3"/><rect x="63" y="${top}" width="8" height="${76-top}" rx="4" fill="${col}"/><circle cx="67" cy="80" r="13" fill="${col}" stroke="${OL}" stroke-width="3"/><path d="M76 30h5M76 42h5M76 54h5" stroke="${OL}" stroke-width="2.5"/><circle cx="63" cy="76" r="3" fill="#fff" opacity=".6"/>`}
const leaf=(x,y,r)=>`<ellipse cx="${x}" cy="${y}" rx="8" ry="4.5" transform="rotate(${r} ${x} ${y})" fill="#6CCB5F" stroke="${OL}" stroke-width="2.5"/>`;

const ART={};
// weather
ART.w_sunny=SV('0 0 100 100',sun(50,50,24));
ART.w_cloudy=SV('0 0 100 100',cloud(64,38,.7,'#DCE6F2')+cloud(44,60,1,'#FFFFFF')+face(44,64,.8));
ART.w_rainy=SV('0 0 100 100',cloud(50,40,1,'#D5E2F0')+face(50,44,.8,'sad')+drop(30,78)+drop(50,88)+drop(70,78));
ART.w_snowy=SV('0 0 100 100',cloud(50,38,1,'#F4F8FC')+face(50,42,.8,'o')+flake(28,80,8)+flake(52,88,8)+flake(74,78,8));
ART.w_stormy=SV('0 0 100 100',cloud(50,36,1,'#8E9BB0')+face(50,40,.8,'sad')+bolt(-2,4));
ART.w_windy=SV('0 0 100 100',ln('M8 34 H58 a10 10 0 1 0 -10 -10','#BFE3FF',5)+ln('M8 52 H76 a11 11 0 1 1 -11 11','#BFE3FF',5)+ln('M14 70 H46 a8 8 0 1 1 -8 8','#BFE3FF',5)+leaf(78,26,-30)+leaf(86,44,20)+leaf(66,84,40));
ART.w_foggy=SV('0 0 100 100',cloud(52,34,.85,'#E9EEF3')+face(52,38,.7,'o')+[[10,58,62],[28,70,62],[14,82,58]].map(([x,y,w])=>`<rect x="${x}" y="${y}" width="${w}" height="8" rx="4" fill="#D5DCE4" stroke="${OL}" stroke-width="2.5"/>`).join(''));
ART.w_hot=SV('0 0 100 100',sun(32,36,17)+thermo(.95,'#FF4D4D')+drop(22,76,.8).replace('#4FA3F7','#8FD3FF')+drop(36,84,.7).replace('#4FA3F7','#8FD3FF'));
ART.w_cold=SV('0 0 100 100',thermo(.2,'#3D9BE9')+flake(28,30,10)+flake(34,64,8)+flake(16,84,6));
ART.w_rainbow=SV('0 0 100 100',['#FF5A5F','#FF9F1C','#FFD54A','#2EC27E','#3D9BE9','#9B5DE5'].map((c,i)=>{const r=40-i*5.5;return `<path d="M${50-r} 72 A${r} ${r} 0 0 1 ${50+r} 72" fill="none" stroke="${c}" stroke-width="6"/>`}).join('')+`<path d="M8 72 A42 42 0 0 1 92 72" fill="none" stroke="${OL}" stroke-width="2.5"/><path d="M19 72 A31 31 0 0 1 81 72" fill="none" stroke="${OL}" stroke-width="2"/>`+cloud(18,72,.45,'#fff')+cloud(82,72,.45,'#fff'));

// kid figure (body topic)
const SK='#F6CBA8',HR='#8B4A2B',RB='#E8458B',TR='#FFC93C';
function kidHand(x,y,mode){const palm=`<circle cx="${x}" cy="${y}" r="11" fill="${SK}" stroke="${OL}" stroke-width="3"/>`;
 if(mode==='point')return ln(`M${x} ${y-4} L${x} ${y-26}`,SK,6)+palm+ln(`M${x-8} ${y+1} L${x-12} ${y-6}`,SK,5);
 const fs=[[-10,-14,-8],[-4,-20,-12],[3,-21,-12],[10,-17,-9]];

const mascotImg=cls=>h('img',{src:MASCOT,class:'mascot '+cls,alt:'',draggable:'false'});
function burst(el,fx=.86,fy=.24,n=12){if(!el||!el.isConnected)return;const r=el.getBoundingClientRect();sparkAt(r.left+r.width*fx,r.top+r.height*fy,n)}
function sparkAt(x,y,n=12){
 for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.4,d=60+Math.random()*90;const s=h('div',{class:'spark',style:`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`},Math.random()<.5?'⭐':'✨');document.body.append(s);setTimeout(()=>s.remove(),1000)}}
function react(el,type){if(!el)return;el.classList.remove('happy','oops');void el.offsetWidth;el.classList.add(type);if(type==='happy')burst(el)}

/* ---------- sounds ---------- */
let actx;
function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx}
function tone(f,t0,dur,type,vol,f2){const c=ac();if(!c)return;const t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05)}
function sndOk(){tone(1318,0,.1,'triangle',.22);tone(1760,.06,.1,'triangle',.2);tone(2637,.12,.45,'sine',.18,3520);tone(3136,.18,.4,'sine',.08)}  // şrink!
function sndBad(){tone(311,0,.17,'sawtooth',.16);tone(207,.22,.55,'sawtooth',.18,160)}                                                           // da daaat
function sndTick(){tone(880,0,.1,'triangle',.15,1320)}
function sndPop(){tone(500,0,.09,'square',.12,1800)}
function sndWin(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.11,.32,'triangle',.18))}

/* ---------- speech ---------- */
let voice=null;
const NOVELTY=/bubbles|bells|boing|cellos|bad news|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|bahh|fred|junior|ralph|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
function enVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)&&!NOVELTY.test(v.name))}catch(e){return[]}}
function voiceScore(v){let s=0;if(/premium|enhanced|natural|neural/i.test(v.name))s+=50;if(/samantha|ava|allison|susan|google us english|jenny|aria|zoe|karen|serena|moira|tessa|daniel/i.test(v.name))s+=20;if(/en[-_]US/i.test(v.lang))s+=10;if(/en[-_]GB/i.test(v.lang))s+=5;return s}
function loadVoice(){const vs=enVoices().sort((a,b)=>voiceScore(b)-voiceScore(a));voice=vs.find(v=>v.name===prog.voiceName)||vs[0]||null}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function say(text,onend){try{if(!('speechSynthesis' in window)){onend&&onend();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voice)u.voice=voice;u.rate=prog.rate||.8;u.pitch=prog.pitch||1.1;if(onend)u.onend=onend;speechSynthesis.speak(u)}catch(e){onend&&onend()}}
function stopSay(){try{speechSynthesis.cancel()}catch(e){}try{stopMusic()}catch(e){}}
function speaker(text,size){const b=h('button',{class:'spk '+(size||'big'),'aria-label':'Listen'},artEl('spk'));b.addEventListener('click',e=>{e.stopPropagation();ac();b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');say(typeof text==='function'?text():text)});return b}

function makeRig(wrap){
 wrap.innerHTML=rigSVG();const q=id=>wrap.querySelector('#'+id);
 const tf=(el,t,ms=380,ease='cubic-bezier(.35,1.4,.5,1)')=>{el.style.transition=`transform ${ms}ms ${ease}`;el.style.transform=t};
 const ang=(s,hnd,t)=>(Math.atan2(t[1]-s[1],t[0]-s[0])-Math.atan2(hnd[1]-s[1],hnd[0]-s[0]))*180/Math.PI;
 let walkT=null,waveT=null;
 const R={wrap,
  arm(side,deg,ms){tf(q('arm'+side),`rotate(${deg}deg)`,ms)},
  armTo(side,x,y,ms){let d=side==='R'?ang(RIG.sR,RIG.hR,[x,y]):ang(RIG.sL,RIG.hL,[x,y]);if(side==='R'&&d<-30)d+=360;if(side==='L'&&d>30)d-=360;R.arm(side,d,ms)},
  arms(rx,ry,lx,ly,ms){R.armTo('R',rx,ry,ms);R.armTo('L',lx,ly,ms)},
  rest(ms){R.arm('R',0,ms);R.arm('L',0,ms)},
  leg(side,deg,ms){tf(q('leg'+side),`rotate(${deg}deg)`,ms)},
  head(rot=0,dy=0,ms){tf(q('head'),`translateY(${dy}px) rotate(${rot}deg)`,ms)},
  look(dx=0,dy=0){tf(q('pup'),`translate(${dx}px,${dy}px)`,200,'ease')},
  eyes(open){q('eyesO').style.display=open?'':'none';q('eyesC').style.display=open?'none':''},
  mouth(m){['smile','o','teeth','tongue'].forEach(k=>q('m_'+k).style.display=k===m?'':'none')},
  show(id,on){q(id).style.display=on?'':'none'},
  pulse(id){const e=q(id);e.style.transformOrigin='center';e.style.transformBox='fill-box';e.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:500,iterations:2})},
  walk(on){clearInterval(walkT);if(!on){R.leg('R',0,200);R.leg('L',0,200);tf(wrap.firstChild,'none',200);return}let p=0;const st=()=>{p^=1;R.leg('R',p?16:-12,260);R.leg('L',p?-12:16,260);R.arm('R',p?-12:14,260);R.arm('L',p?12:-14,260);tf(wrap.firstChild,`translateY(${p?-6:0}px)`,260,'ease')};st();walkT=setInterval(st,280)},
  wave(on){clearInterval(waveT);if(!on){R.arm('R',0);return}let p=0;const b=ang(RIG.sR,RIG.hR,[20,80]);R.arm('R',b,300);waveT=setInterval(()=>{p^=1;R.arm('R',b+(p?22:-18),240)},260)},
  shake(id,deg=8,n=3){q(id).animate([{transform:'rotate(0)'},{transform:`rotate(${deg}deg)`},{transform:`rotate(${-deg}deg)`},{transform:'rotate(0)'}],{duration:400,iterations:n})},
  hop(){wrap.firstChild.animate([{transform:'translateY(0)'},{transform:'translateY(-14%)'},{transform:'translateY(0)'}],{duration:450,easing:'ease-out'})},
  stopAll(){clearInterval(walkT);clearInterval(waveT)}};
 return R}

/* ---------- music ---------- */
let MUSIC=null;
function startMusic(){stopMusic();const c=ac();if(!c)return;const out=c.createGain();out.gain.value=.55;out.connect(c.destination);
 const beat=60/118,eighth=beat/2;let next=c.currentTime+.08,step=0;
 const nb=c.createBuffer(1,c.sampleRate*.3,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const osc=(t,f,type,dur,vol,f2)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(out);o.start(t);o.stop(t+dur+.02)};
 const noise=(t,dur,vol,type,fr)=>{const s=c.createBufferSource();s.buffer=nb;const f=c.createBiquadFilter();f.type=type;f.frequency.value=fr;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(out);s.start(t);s.stop(t+dur)};
 const BASS=[130.81,130.81,196,196,220,220,174.61,196];const MEL=[523,0,659,0,784,659,0,523,587,0,698,0,880,698,0,587];
 const tick=()=>{while(next<c.currentTime+.25){const s=step%16,bar=Math.floor(step/16)%8;
  if(s%4===0)osc(next,150,'sine',.18,.7,45);
  if(s%8===4)noise(next,.14,.35,'bandpass',1800);
  if(s%2===1)noise(next,.04,.12,'highpass',7000);
  if(s%2===0)osc(next,BASS[bar]/2,'triangle',eighth*1.8,.32);
  const m=MEL[s]*(bar%2?1.122:1);if(m&&bar>1)osc(next,m,'square',eighth*.9,.045);
  if(s%4===0&&bar>1)osc(next,BASS[bar]*2,'triangle',beat*.9,.06);
  next+=eighth;step++}};
 tick();const T=setInterval(tick,60);MUSIC={stop(){clearInterval(T);try{out.gain.setTargetAtTime(0,c.currentTime,.25)}catch(e){}}}}
function stopMusic(){if(MUSIC){MUSIC.stop();MUSIC=null}}
const ring=()=>{for(let i=0;i<8;i++){tone(1400,i*.12,.08,'square',.08);tone(1700,i*.12+.06,.06,'square',.06)}};
const splashSnd=()=>{for(let i=0;i<5;i++)tone(600+Math.random()*900,i*.06,.08,'sine',.08,300)};
const brushSnd=()=>{const c=ac();if(!c)return;for(let i=0;i<10;i++)tone(2400+Math.random()*800,i*.09,.05,'sawtooth',.02,1800)};

function pMatch(st){
 const its=pickN(S.items,Math.min(4,S.items.length)),ns='http://www.w3.org/2000/svg';
 st.append(inst('Tap 🔊, listen, draw a line to the match'));
 const box=h('div',{class:'match'}),svg=document.createElementNS(ns,'svg'),L=h('div',{class:'col'}),R=h('div',{class:'col'});
 const lefts=its.map(it=>{const d=h('div',{class:'mItem left'},h('div',{class:'spk mid'},artEl('spk')),h('div',{class:'dot'}));d._it=it;L.append(d);return d});
 const rights=shuffle(its).map(it=>{const d=h('div',{class:'mItem rightI'},h('div',{class:'dot'}),vis(it));d._it=it;R.append(d);return d});
 box.append(svg,L,h('div',{class:'gap'}),R);st.append(box);
 const pairs=[];let sel=null;
 const pt=el=>{const b=box.getBoundingClientRect(),r=el.querySelector('.dot').getBoundingClientRect();return[r.left+r.width/2-b.left,r.top+r.height/2-b.top]};
 const mk=(a,b,col,dash)=>{const l=document.createElementNS(ns,'line');l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);l.setAttribute('stroke',col);l.setAttribute('stroke-width',9);l.setAttribute('stroke-linecap','round');if(dash)l.setAttribute('stroke-dasharray','2 16');svg.append(l);return l};
 const redraw=()=>{svg.innerHTML='';pairs.forEach(([a,b])=>mk(pt(a),pt(b),'#2EC27E'))};
 const onRs=()=>{if(box.isConnected)redraw();else window.removeEventListener('resize',onRs)};window.addEventListener('resize',onRs);
 function tryMatch(l,r){if(!r||r.classList.contains('matched'))return;
  if(l._it===r._it){l.classList.add('matched');r.classList.add('matched');l.classList.remove('sel');pairs.push([l,r]);redraw();say(l._it.say);
   if(pairs.length===its.length)good(1400);else sndOk()}
  else bad(r)}
 lefts.forEach(l=>{l.addEventListener('pointerdown',e=>{if(S.busy||l.classList.contains('matched'))return;e.preventDefault();ac();say(prompt(l._it));
   lefts.forEach(x=>x.classList.remove('sel'));l.classList.add('sel');sel=l;const a=pt(l);let tmp=null;
   const move=ev=>{const b=box.getBoundingClientRect();if(tmp)tmp.remove();tmp=mk(a,[ev.clientX-b.left,ev.clientY-b.top],'#2B2D42',true)};
   const up=ev=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);if(tmp)tmp.remove();
    const t=document.elementFromPoint(ev.clientX,ev.clientY);const r=t&&t.closest('.rightI');if(r){tryMatch(l,r);sel=null;l.classList.remove('sel')}};
   window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)})});
 rights.forEach(r=>r.addEventListener('click',()=>{if(S.busy||!sel)return;tryMatch(sel,r);if(sel)sel.classList.remove('sel');sel=null}));
}

 let open=[],lock=false,matched=0;
 cards.forEach(c=>{const el=h('button',{class:'mcard'},h('span',{class:'back'},artEl('p_star')),h('span',{class:'front'},c.face));
  el.onclick=()=>{ac();if(lock||S.busy||el.classList.contains('up'))return;el.classList.add('up');say(c.it.say);open.push({el,c});
   if(open.length===2){lock=true;const[a,b]=open;
    if(a.c.it===b.c.it){setTimeout(()=>{a.el.classList.add('done');b.el.classList.add('done');open=[];lock=false;matched++;if(matched===k)good(1300);else sndOk()},450)}
    else setTimeout(()=>{sndBad();a.el.classList.remove('up');b.el.classList.remove('up');open=[];lock=false},1100)}};
  grid.append(el)})}

function pYesNo(st){const it=fresh(),truth=Math.random()<.5,asked=truth?it:pickN(others(it),1)[0],q=asked.say+'?';
 const ans=yes=>{ac();if(S.busy)return;if(yes===truth){if(!truth)later(()=>say(it.say),300);else say('Yes! '+it.say);good(1600)}else bad(yes?bY:bN)};
 const bY=h('button',{class:'yn y',onclick:()=>ans(true)},'✓'),bN=h('button',{class:'yn n',onclick:()=>ans(false)},'✗');
 st.append(inst('Listen 👂 Yes or no?'),h('div',{class:'row'},h('div',{class:'bigshow'},vis(it)),speaker(q,'mid')),h('div',{class:'row'},bY,bN));
 later(()=>say(q),450)}

function pFindAll(st){const it=fresh(),n=3,rest=others(it),cells=shuffle([...Array(n).fill(it),...range(1,8-n).map(()=>rest[rnd(rest.length)])]);
 const cue='Find all: '+it.say+'!';let found=0;
 const grid=h('div',{class:'fgrid'});
 st.append(h('div',{class:'row'},speaker(cue,'mid'),inst('Listen 👂 and find them all ('+n+')')),grid);
 cells.forEach(c=>{const el=h('button',{class:'fcell'},vis(c));el.onclick=()=>{ac();if(S.busy||el.classList.contains('found'))return;
  if(c===it){el.classList.add('found');found++;say(it.say);if(found===n)good(1300);else sndTick()}else bad(el)};grid.append(el)});
 later(()=>say(cue),450)}

const SHAPES=[['star','M50 6 L61 38 L95 38 L67 58 L78 92 L50 71 L22 92 L33 58 L5 38 L39 38 Z'],['heart','M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C40 8 46 14 50 22 C54 14 60 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z'],['ball','M50 8 A42 42 0 1 1 49.9 8 Z'],['house','M50 8 L92 44 L80 44 L80 92 L20 92 L20 44 L8 44 Z'],['fish','M8 50 C28 18 64 18 78 50 C64 82 28 82 8 50 Z M76 50 L96 30 L96 70 Z']];
function pPaint(st){const it=fresh(x=>!x.light),[sn,d]=SHAPES[rnd(SHAPES.length)],cue='Paint the '+sn+' '+it.say+'!';
 const svg='<svg viewBox="0 0 100 100"><path d="'+d+'" fill="#FFFFFF" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/></svg>';
 const cv=h('div',{class:'canvas'});cv.innerHTML=svg;
 st.append(inst('Listen 👂 and paint it 🖌️'),h('div',{class:'row'},cv,speaker(cue,'mid')),
  choiceRow(options(it,4),vis,o=>o===it,o=>{cv.querySelector('path').setAttribute('fill',o.val);say(it.say+' '+sn+'!');good(1700)}));
 later(()=>say(cue),450)}

function pListenPick(st){const it=fresh(),opts=options(it);let selected=null,selEl=null;
 const ok=h('button',{class:'btn',disabled:''},'Pick ✓');
 const row=h('div',{class:'choices'});
 opts.forEach((o,i)=>{const c=h('button',{class:'card lcard'},h('span',{class:'lsp'},artEl('p_listen')),h('span',{class:'lno'},String(i+1)));
  c.onclick=()=>{ac();if(S.busy)return;say(prompt(o));row.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');selected=o;selEl=c;ok.removeAttribute('disabled')};row.append(c)});
 ok.onclick=()=>{ac();if(S.busy||!selected)return;if(selected===it){selEl.classList.remove('sel');selEl.classList.add('right');good(1300)}else bad(selEl)};
 st.append(inst('Which one is it? Listen and pick'),h('div',{class:'bigshow'},vis(it)),row,ok)}

function pQuickTap(st){const its=pickN(S.items,Math.min(4,S.items.length)),total=5;let step=0,cur=null;
 const info=inst('');const row=h('div',{class:'choices'});
 const next=()=>{let c;do{c=its[rnd(its.length)]}while(c===cur&&its.length>1);cur=c;info.textContent='Listen 👂 and tap fast! ('+(step+1)+'/'+total+')';say(prompt(cur))};
 its.forEach(o=>{const c=h('button',{class:'card'},vis(o));c.onclick=()=>{ac();if(S.busy||!cur)return;
  if(o===cur){c.classList.add('right');setTimeout(()=>c.classList.remove('right'),500);step++;cur=null;if(step===total)good(1200);else{sndTick();later(next,700)}}
  else{c.classList.add('wrong');bad(c);setTimeout(()=>c.classList.remove('wrong'),700)}};row.append(c)});
 st.append(info,speaker(()=>cur?prompt(cur):'','mid'),row);later(next,450)}

const NOSHADOW=['wall','door','window'];
function pShadow(st){const ok=x=>!NOSHADOW.includes(x.key),it=fresh(ok),opts=shuffle([it,...pickN(S.items.filter(x=>ok(x)&&x!==it),2)]);
 st.append(inst('Find the shadow 🌑'),h('div',{class:'row'},h('div',{class:'bigshow'},vis(it)),speaker(it.say,'mid')),
  choiceRow(opts,o=>{const v=vis(o);v.classList.add('shadow');return v},o=>o===it,(o,c)=>{c.querySelector('.vis').classList.remove('shadow');say(it.say);good(1500)}));
 later(()=>say(it.say),450)}

function pSounds(st){const it=fresh(x=>!!x.sound),cue=it.sound;
 st.append(inst('Listen 🎵 Who says this?'),speaker(cue),choiceRow(shuffle([it,...pickN(S.items.filter(x=>x!==it),2)]),vis,o=>o===it,o=>{say('The '+o.say+' says '+o.sound.split('!')[0].toLowerCase()+'!');good(2600)}));
 later(()=>say(cue),450)}
function pSayIt(st){const it=fresh(),line="Make a "+it.say+" face! Say: I'm "+it.say+"!";
 const ok=h('button',{class:'btn big',onclick:()=>{ac();if(S.busy)return;say('Great job!');good(1400)}},'✓ I did it!');
 st.append(inst('Make the face and say it! 🗣️'),h('div',{class:'row'},h('div',{class:'bigshow'},vis(it)),speaker(()=>"I'm "+it.say+"!",'mid')),ok);later(()=>say(line),450)}
function pShowMe(st){const it=fresh(x=>SHOWME.includes(x.key)),cue='Touch the '+it.say+'!';
 const fig=h('div',{class:'figure'});fig.innerHTML=ART.kidFull;
 fig.addEventListener('pointerdown',e=>{ac();if(S.busy)return;const t=e.target&&e.target.closest?e.target.closest('[data-part]'):null;if(!t)return;
  const part=t.getAttribute('data-part');
  if((ACCEPT[it.key]||[it.key]).includes(part)){sparkAt(e.clientX,e.clientY,14);say('Yes! '+it.say+'!');good(1600)}else bad(fig)});
 st.append(h('div',{class:'row'},speaker(cue,'mid'),inst('Listen 👂 and touch it on Ada')),fig);later(()=>say(cue),450)}

/* ---------- practices (numbers only) ---------- */
const THINGS=['apple','star','ladybug','fish','flower','chick','strawberry','balloon','heart','orange'];
function pCount(st){const it=fresh(),n=it.n,em=THINGS[rnd(THINGS.length)];
 st.append(inst('How many? Count and pick 🤔'),h('div',{class:'things'+(n>10?' many':'')},range(1,n).map(i=>h('span',{style:`animation-delay:${i*.05}s`},artEl(em)))),
  choiceRow(options(it),vis,o=>o===it,o=>{say(o.say);good(1500)}));
 later(()=>say('How many?'),400)}

function pBasket(st){const small=S.items.filter(x=>x.n<=12),it=fresh(small.length?(x=>x.n<=12):null),n=it.n,fruit=['apple','orange','strawberry','pear'][S.round%4];
 const phrase='Put '+it.say+' in the basket!';
 const tree=h('div',{class:'tree'}),basket=h('div',{class:'basket'},h('div',{class:'lbl'},artEl('p_basket'))),cnt=h('div',{class:'counter'},'0');
 const upd=()=>{cnt.textContent=basket.querySelectorAll('.apple').length};
 range(1,Math.max(9,n+3)).forEach(()=>{const a=h('button',{class:'apple'},artEl(fruit));a.onclick=()=>{ac();if(S.busy)return;
  if(a.parentNode===tree){basket.insertBefore(a,basket.lastChild);upd();const c=+cnt.textContent;say(NW[c]||String(c))}else{tree.append(a);upd();sndTick()}};tree.append(a)});
 const ok=h('button',{class:'btn'},'Done ✓');
 ok.onclick=()=>{ac();if(S.busy)return;if(+cnt.textContent===n){say(it.say+'!');good(1500)}else{bad(basket);later(()=>say(phrase),900)}};
 st.append(h('div',{class:'row'},speaker(phrase,'mid'),inst('Listen 👂 and put that many in the basket')),h('div',{class:'orchard'+(n>9?' many':'')},tree,basket),h('div',{class:'row'},cnt,ok));
 later(()=>say(phrase),450)}

function pOrder(st){const its=pickN(S.items,Math.min(5,S.items.length)),sorted=its.slice().sort((a,b)=>a.n-b.n);let k=0;
 const slots=h('div',{class:'slots'},sorted.map(()=>h('div',{class:'slot'})));
 const tiles=h('div',{class:'tiles'});
 st.append(inst('Tap from smallest to biggest 🪜'),slots,tiles);
 its.forEach(it=>{const t=h('button',{class:'tile2'},vis(it));t.onclick=()=>{ac();if(S.busy)return;
  if(it===sorted[k]){const s=slots.children[k];s.append(vis(it));s.classList.add('full');t.classList.add('gone');say(it.say);k++;
   if(k===sorted.length)good(1500);else sndTick()}else bad(t)};tiles.append(t)})}

function pMissing(st){const r=getRange(),len=Math.min(4,r.max-r.min+1),s=r.min+rnd(r.max-r.min-len+2),seq=range(s,s+len-1),miss=1+rnd(len-1),n=seq[miss];
 const it=S.items.find(x=>x.n===n);
 const cells=seq.map((v,i)=>i===miss?h('div',{class:'slot q'},'?'):h('div',{class:'slot full',style:'animation:none'},vis(S.items.find(x=>x.n===v))));
 const readSeq=()=>seq.map((v,i)=>i===miss?'hmm':NW[v]).join(', ');
 st.append(inst('Which number is missing? 🧩'),h('div',{class:'row'},speaker(readSeq,'mid'),h('div',{class:'slots'},cells)),
  choiceRow(options(it),vis,o=>o===it,()=>{const c=cells[miss];c.className='slot full';c.textContent='';c.append(vis(it));say(seq.map(v=>NW[v]).join(', '));good(2600)}));
 later(()=>say(readSeq()),450)}
